<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CanalTV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tela">
    <div id="player"></div>
    <div id="capa"></div>  <!-- recebe toques; o player do YouTube fica por baixo -->

    <div id="banner" class="oculto">
      <div class="b-topo"><span id="b-num"></span><span id="b-nome"></span><span id="b-vivo" class="vivo">AO VIVO</span></div>
      <div id="b-agora"></div>
      <div id="b-seguir"></div>
    </div>

    <div id="digitos" class="oculto"></div>
    <div id="aviso" class="oculto"></div>

    <div id="controles" class="oculto">
      <button data-a="canal-" title="Canal anterior (↓)">CH ▼</button>
      <button data-a="canal+" title="Próximo canal (↑)">CH ▲</button>
      <span class="sep"></span>
      <button data-a="inicio" title="Do início (Home)">⏮</button>
      <button data-a="voltar" title="Voltar 30s (←)">⏪</button>
      <button data-a="pausa" title="Pausar (espaço)">⏯</button>
      <button data-a="avancar" title="Avançar 30s (→)">⏩</button>
      <button data-a="aovivo" class="acc" title="Voltar ao vivo (L)">● Ao vivo</button>
      <span class="sep"></span>
      <button data-a="vol-" title="Volume − (-)">🔉</button>
      <button data-a="mudo" title="Mudo (M)">🔇</button>
      <button data-a="vol+" title="Volume + (+)">🔊</button>
      <span class="sep"></span>
      <button data-a="guia" title="Guia de canais (G)">☰ Guia</button>
      <button data-a="tela" title="Tela cheia (F)">⛶</button>
    </div>

    <aside id="guia" class="oculto">
      <div class="g-cab"><b>Canais</b><button data-a="guia">✕</button></div>
      <div id="g-lista"></div>
      <div class="g-cab"><b>Programação</b></div>
      <div id="g-grade"></div>
      <div id="g-fonte"></div>
    </aside>

    <div id="ligar">
      <div class="logo">📺 CanalTV</div>
      <button id="btn-ligar">▶ Ligar a TV</button>
      <div class="dica">↑↓ troca de canal · ←→ volta/avança · L ao vivo · G guia</div>
    </div>
  </div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
